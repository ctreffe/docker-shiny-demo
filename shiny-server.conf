# One application, with the server and its R sessions running as the shiny user.
run_as shiny;
preserve_logs true;
sanitize_errors true;
# Even unused bookmark storage must be writable when a worker is initialized.
bookmark_state_dir /tmp/shiny-server/bookmarks;

server {
  listen 3838;
  location / {
    app_dir /srv/shiny-server;
    # The root filesystem is read-only; disposable session logs live in tmpfs.
    log_dir /tmp/shiny-server;
  }
}
